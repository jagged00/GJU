l_english:
#Mysterious herb event
  cultivation_travel_events.001.t:0 "Mysterious Herb"
  cultivation_travel_events.001.desc:0 "You discover a rare herb in the wilderness, but a territorial beast lingers nearby. It is dangerous, yet the prize may be worth the risk."
  cultivation_travel_events.001.a:0 "Drive the beast away and claim the herb"
  cultivation_travel_events.001.b:0 "Drive the beast away and store the herb for later"
  cultivation_travel_events.001.c:0 "Leave it undisturbed"
#Tomb call
  cultivation_travel_events.002.t:0 "Call from the Dead"
  cultivation_travel_events.002.desc:0 "While traveling, you feel a faint pull guiding you toward an old tomb. As you approach, a lingering spirit appears and claims to be the remnant of a deceased cultivator willing to offer guidance."
  cultivation_travel_events.002.a:0 "Attack the spirit and try to consume it"
  cultivation_travel_events.002.b:0 "Hear the spirit out"
  cultivation_travel_events.002.c:0 "Leave the tomb in peace"
#Dilapidated place
  cultivation_travel_events.003.t:0 "Forgotten ruins"
  cultivation_travel_events.003.desc:0 "While traveling, you come across a stretch of forgotten ruins. You could explore them, though danger may still linger within."
  cultivation_travel_events.003.a:0 "Explore the ruins"
  cultivation_travel_events.003.b:0 "Ignore them"

#Danger travel
#Poison mist
  cultivation_travel_events.101.t:0 "Poisonous Mist"
  cultivation_travel_events.101.desc:0 "While traveling, you spot a greenish mist ahead. You may pass through it, but the vapors could be toxic."
  cultivation_travel_events.101.a:0 "Pass through it anyway"
  cultivation_travel_events.101.b:0 "Try to go around it"
#A cultivator robs u
  cultivation_travel_events.102.t:0 "Dangerous Encounter"
  cultivation_travel_events.102.desc:0 "While traveling, a shady figure approaches and demands silver, threatening violence if you refuse."
  cultivation_travel_events.102.a:0 "Fight back"
  cultivation_travel_events.102.b:0 "Give him the money"
  cultivation_travel_events.102.c:0 "Try to run away"
