 cultivation_sect_join.1054.t:0 "Join the Manor of Heavenly Arrays"
 cultivation_sect_join.1054.desc:0 "A manor elder considers whether your patience, cultivation, and wealth are sufficient for a path devoted to heavenly defenses."
 cultivation_sect_join.1100.t:0 "Join the Wudang Sect"
 cultivation_sect_join.1100.desc:0 "The Wudang elder measures your composure, your breath, and your resources before deciding whether you may study beneath their mountain pines."
 cultivation_sect_join.1101.t:0 "Join the Shaolin Temple"
 cultivation_sect_join.1101.desc:0 "A Shaolin elder judges your discipline, humility, and material support before offering you a place within the temple."
 cultivation_sect_join.1102.t:0 "Join the Eternal Harmony Pavilion"
