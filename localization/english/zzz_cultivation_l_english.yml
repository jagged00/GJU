 cultivation_sect_join.1103.t:0 "Join the Jade Lotus Temple"
 cultivation_sect_join.1103.desc:0 "A temple elder studies your heart, your restraint, and your means before inviting you to tread the balanced path of the Jade Lotus."
 cultivation_sect_join.1104.t:0 "Join the Sect of Supreme Equilibrium"
 cultivation_sect_join.1104.desc:0 "The elder examines whether your mind can endure the demands of perfect equilibrium and whether your resources honor the sect's standards."
 cultivation_sect_join.1150.t:0 "Join the Mountain of Divine Beasts"
 cultivation_sect_join.1150.desc:0 "A beastmaster elder judges your courage before sacred companions, along with the cultivation and resources you would bring to the mountain."
 cultivation_sect_join.1151.t:0 "Join the Celestial Phoenix Pavilion"
 cultivation_sect_join.1151.desc:0 "The pavilion elder studies your affinity for spirit birds, your cultivation, and your offered support before pronouncing a decision."
 cultivation_sect_join.1152.t:0 "Join the Dragon-Tongue Pavilion"
 cultivation_sect_join.1152.desc:0 "An elder listens for draconic resonance in your spirit, then weighs your cultivation and means before the pavilion will speak of acceptance."
 cultivation_sect_join.1153.t:0 "Join the Temple of Spirit Communion"
 cultivation_sect_join.1153.desc:0 "The temple elder judges whether you can command the respect of spirit beasts without arrogance, and whether you can sustain the burden of discipleship."
 cultivation_sect_join.1154.t:0 "Join the Thousand Beast Valley"
 cultivation_sect_join.1154.desc:0 "A valley elder considers whether your spirit can bear many covenants, and whether your resources are worthy of such a demanding path."
 cultivation_sect_join.2000.t:0 "Join the Crimson Moon Saber Hall"
 cultivation_sect_join.2000.desc:0 "The hall elder weighs your courage, saber talent, and resources before allowing you to walk their moonlit killing path."
 cultivation_sect_join.2001.t:0 "Join the Tyrant Saber Palace"
 cultivation_sect_join.2001.desc:0 "A palace elder measures the force of your will, the edge of your saber art, and the wealth behind your petition."
 cultivation_sect_join.2002.t:0 "Join the Galehowl Saber Hall"
 cultivation_sect_join.2002.desc:0 "The elder tests whether your reflexes, cultivation, and means can keep pace with the hall's wind-fast discipline."
 cultivation_sect_join.2003.t:0 "Join the Demon Suppressing Blade Clan"
 cultivation_sect_join.2003.desc:0 "A clan elder gauges your resolve against demonic foes and whether your foundation and resources are fit for their harsh blade law."
 cultivation_sect_join.2004.t:0 "Join the Black Iron Saber Hall"
 cultivation_sect_join.2004.desc:0 "The elder studies your body, your saber foundation, and your purse before granting entry to the Black Iron path."
 cultivation_sect_join.2050.t:0 "Join the Jade Cauldron Hall"
 cultivation_sect_join.2050.desc:0 "An alchemy elder tests whether your meridians, patience, and resources are enough to approach the Jade Cauldron furnaces."
 cultivation_sect_join.2051.t:0 "Join the Medicine King Valley"
 cultivation_sect_join.2051.desc:0 "The valley elder considers your discernment, medical aptitude, and means before opening the gate to their line of healers and pill masters."
 cultivation_sect_join.2052.t:0 "Join the Hundred Herbs Pavilion"
 cultivation_sect_join.2052.desc:0 "A pavilion elder weighs your reverence for herbs, your cultivation, and the support you offer before granting admission."
 cultivation_sect_join.2053.t:0 "Join the Eternal Furnace Hall"
 cultivation_sect_join.2053.desc:0 "The furnace elder judges whether you possess the endurance, caution, and resources required for their perilous alchemical discipline."
 cultivation_sect_join.2054.t:0 "Join the Hall of Transcendent Elixirs"
 cultivation_sect_join.2054.desc:0 "A senior alchemist measures your talent, ambition, and wealth before allowing you near elixirs said to challenge heaven."
 cultivation_sect_join.2100.t:0 "Join the Pure Yang Palace"
 cultivation_sect_join.2100.desc:0 "The palace elder tests whether your spirit can master blazing yang without falling into reckless excess, and whether your resources meet their demands."
 cultivation_sect_join.2101.t:0 "Join the Yin Phoenix Sect"
 cultivation_sect_join.2101.desc:0 "An elder studies your patience, elegance, and control over yin currents before opening the sect gates to you."
 cultivation_sect_join.2102.t:0 "Join the Pavilion of Blissful Concord"
 cultivation_sect_join.2102.desc:0 "The pavilion elder weighs your restraint, your understanding of harmonious circulation, and the support behind your petition."
 cultivation_sect_join.2103.t:0 "Join the Jade Chamber Court"
 cultivation_sect_join.2103.desc:0 "A court elder judges your discretion, cultivation, and resources before entrusting you with manuals of chamber arts and inner circulation."
 cultivation_sect_join.2104.t:0 "Join the Hall of Lasting Harmony"
 cultivation_sect_join.2104.desc:0 "The elder weighs your temperament, cultivation, and grasp of harmony. Will you enter the Hall of Lasting Harmony?"
 cultivation_sect_join.2150.t:0 "Join the Moonless Night Court"
 cultivation_sect_join.2150.desc:0 "An elder of the Moonless Night Court studies your nerve, cultivation, and means before admitting you to their lightless arts."
 cultivation_sect_join.2151.t:0 "Join the Pale Bone Hall"
 cultivation_sect_join.2151.desc:0 "The hall elder watches for fear in your eyes while judging whether your foundation and resources warrant instruction in corpse command."
 cultivation_sect_join.2152.t:0 "Join the Clan of Eternal Repose"
 cultivation_sect_join.2152.desc:0 "A clan elder weighs whether you can shoulder the karmic burden of funerary bindings, and whether your means satisfy the clan's demands."
 cultivation_sect_join.2153.t:0 "Join the Temple of Withered Souls"
 cultivation_sect_join.2153.desc:0 "The temple elder considers whether your spirit can endure death qi and whether you bring enough resources to walk such a bleak road."
 cultivation_sect_join.2154.t:0 "Join the Jiangshi March Sect"
 cultivation_sect_join.2154.desc:0 "An elder judges whether you can command jiangshi without flinching and whether your cultivation and resources justify admission."
 cultivation_sect_join.3000.t:0 "Join the Scarlet River Hall"
 cultivation_sect_join.3000.desc:0 "The elder studies the strength of your resolve, the sharpness of your blood essence, and the offering you lay before Scarlet River Hall."
 cultivation_sect_join.3001.t:0 "Join the Valley of Ten Thousand Corpses"
 cultivation_sect_join.3001.desc:0 "A valley elder tests whether you can endure the resentment of the dead and whether your resources merit entry into their charnel domain."
 cultivation_sect_join.3002.t:0 "Join the Asura War Hall"
 cultivation_sect_join.3002.desc:0 "The hall elder judges your hunger for battle, your martial foundation, and the means behind your petition."
 cultivation_sect_join.3050.t:0 "Join the Hall of Five Venoms"
 cultivation_sect_join.3050.desc:0 "An elder inspects your tolerance for poison, your cultivation, and the resources you offer before admitting you to the venoms."
 cultivation_sect_join.3051.t:0 "Join the Valley of Venomous Serpents"
 cultivation_sect_join.3051.desc:0 "The valley elder watches your reaction to coiling spirit serpents while judging your fitness and support for their arts."
 cultivation_sect_join.3052.t:0 "Join the Sect of the Miasma Marsh"
 cultivation_sect_join.3052.desc:0 "An elder of the marsh weighs whether your body can survive miasma cultivation and whether your resources merit acceptance."
 cultivation_sect_join.3100.t:0 "Join the Crimson Yin Sect"
 cultivation_sect_join.3100.desc:0 "The elder studies the strength of your blood essence and your resolve. Will you join the Crimson Yin Sect?"
 cultivation_sect_join.3101.t:0 "Join the Blood Moon Demon Hall"
 cultivation_sect_join.3101.desc:0 "A demonic elder judges your courage before the blood moon, along with the cultivation and resources you would bring to their hall."
 cultivation_sect_join.3102.t:0 "Join the Scarlet Heart Palace"
 cultivation_sect_join.3102.desc:0 "The palace elder measures your appetite for forbidden heart arts and whether your resolve and resources can bear the price."
 cultivation_sect_join.3150.t:0 "Join the Palace of Devouring Shadows"
 cultivation_sect_join.3150.desc:0 "The elder studies your vitality, resolve, and talent for beguiling arts. Will you enter the Palace of Devouring Shadows?"
 cultivation_sect_join.3151.t:0 "Join the Crimson Seal Sect"
 cultivation_sect_join.3151.desc:0 "The elder examines your control over seals, blood, and forbidden bindings. Will you join the Crimson Seal Sect?"
 cultivation_sect_join.4000.t:0 "Join the Lone Wolf Lodge"
 cultivation_sect_join.4000.desc:0 "A lodge elder regards your road-worn bearing, personal skill, and means before deciding whether you belong among their wanderers."
 cultivation_sect_join.4001.t:0 "Join the Rootless Sword Society"
 cultivation_sect_join.4001.desc:0 "The elder judges whether you can preserve freedom without forsaking discipline, and whether your resources honor the society's customs."
 cultivation_sect_join.4002.t:0 "Join the Brotherhood of Wandering Blades"
 cultivation_sect_join.4002.desc:0 "A brotherhood elder weighs the truth of your oaths, your blade skill, and the support you bring from the road."
 cultivation_sect_join.4050.t:0 "Join the Thousand Treasures Pavilion"
 cultivation_sect_join.4050.desc:0 "The pavilion elder studies whether you seek treasures with discernment, and whether your cultivation and resources suit their halls."
 cultivation_sect_join.4051.t:0 "Join the Hall of Mystic Forging"
 cultivation_sect_join.4051.desc:0 "An elder-smith measures your patience, craftsmanship, and means before allowing you near the fires of Mystic Forging."
 cultivation_sect_join.4052.t:0 "Join the Hall of Ancient Relics"
 cultivation_sect_join.4052.desc:0 "The elder judges your hunger for lost inheritances, your nerve, and your offered support before the relic hall considers you."
 cultivation_sect_join.4100.t:0 "Join the Temple of Ancestral Bloodlines"
 cultivation_sect_join.4100.desc:0 "A temple elder examines your lineage, your endurance, and your resources before awakening the blood sleeping in your veins."
 cultivation_sect_join.4101.t:0 "Join the Sect of the Primal Beast"
 cultivation_sect_join.4101.desc:0 "The elder weighs whether you can rule bestial transformation rather than be ruled by it, and whether your means satisfy sect custom."
 cultivation_sect_join.4102.t:0 "Join the Primordial Chaos Hall"
 cultivation_sect_join.4102.desc:0 "An elder measures your flesh, will, and resources before permitting you to pursue the hall's brutal chaos-tempering path."
 cultivation_sect_join.4150.t:0 "Join the Mountain of Untamed Beasts"
 cultivation_sect_join.4150.desc:0 "The mountain elder watches how you stand before savage beasts, then judges your cultivation and resources in silence."
 cultivation_sect_join.4151.t:0 "Join the Savage Fang Lodge"
 cultivation_sect_join.4151.desc:0 "An elder of the lodge weighs your scars, your courage, and the offerings behind your petition before opening the clan's gate."
 cultivation_sect_join.4152.t:0 "Join the Spirit Bond Sect"
 cultivation_sect_join.4152.desc:0 "The elder studies whether your spirit can truly share strength with a beast companion, and whether your resources honor the covenant."

