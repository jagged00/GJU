 ## VISIT EVENTS

 visit_cultivation_sect_decision:0 "Visit Cultivation Sect"
 visit_cultivation_sect_decision_desc:0 "In China cultivaters is part of some sects. Some sects has bacground old as this world and some is just founded. Visit a sect to learn more about them. Find out their history, their way of cultivation and maybe you will want to join them or make them Tremble in your presence."
 visit_cultivation_sect_decision_tooltip:0 "Choose a sect to visit."
 visit_cultivation_sect_decision_confirm:0 "Visit Sect"

 cultivation_sect_visit.1000.t:0 "Mount Hua Sect"
 cultivation_sect_visit.1000.desc:0 "Mount Hua sword disciples move with austere grace, their peaks wreathed in cloud and old prestige. A watchful elder measures your bearing before speaking."
 cultivation_sect_visit.1001.t:0 "Heavenly Sword Pavilion"
 cultivation_sect_visit.1001.desc:0 "Sharp sword intent lingers through these pavilions like cold mist over steel. An elder receives you with measured courtesy and an appraising gaze."
 cultivation_sect_visit.1002.t:0 "Azure Edge Sect"
 cultivation_sect_visit.1002.desc:0 "Azure-robed swordsmen practice swift, precise cuts that seem to divide the wind itself. A sect elder studies your posture and breathing."
 cultivation_sect_visit.1003.t:0 "Ten Thousand Swords Valley"
 cultivation_sect_visit.1003.desc:0 "From every ridge and ravine rises the cry of clashing swords, as if the valley itself remembers old duels. An elder approaches to test your potential."
 cultivation_sect_visit.1004.t:0 "Violet Thunder Blade Sect"
 cultivation_sect_visit.1004.desc:0 "Thunder gathers around the training grounds, and every saber stroke leaves a trace of violet light in the air. A stern elder weighs your worth."
 cultivation_sect_visit.1050.t:0 "Eight Trigrams Palace"
 cultivation_sect_visit.1050.desc:0 "Bagua diagrams and shifting footwork govern every courtyard here, where motion and stillness mirror one another. An elder regards you as though reading a hexagram."
 cultivation_sect_visit.1051.t:0 "Celestial Talisman Hall"
 cultivation_sect_visit.1051.desc:0 "Talismans flicker on walls, doors, and sleeves, humming with restrained spiritual force. A talisman elder considers whether you are fit to learn their scripts."
 cultivation_sect_visit.1052.t:0 "Nine Stars Array Palace"
 cultivation_sect_visit.1052.desc:0 "Star-maps and spirit lines weave through the grounds in intricate order. An array elder watches how you move before deciding whether to entertain your petition."
 cultivation_sect_visit.1053.t:0 "Mystic Seal Pavilion"
 cultivation_sect_visit.1053.desc:0 "Seals of warding and suppression cover the stonework in neat, ancient strokes. A pavilion elder studies your steadiness and control."
 cultivation_sect_visit.1054.t:0 "Manor of Heavenly Arrays"
 cultivation_sect_visit.1054.desc:0 "Every gate and corridor seems part of a greater defensive pattern drawn from heaven itself. A manor elder measures how calmly you stand within layered pressure."
 cultivation_sect_visit.1100.t:0 "Wudang Sect"
 cultivation_sect_visit.1100.desc:0 "Under quiet pines and mountain mists, Wudang disciples cultivate balance in sword, breath, and heart. An elder invites you to speak only after observing your composure."
 cultivation_sect_visit.1101.t:0 "Shaolin Temple"
 cultivation_sect_visit.1101.desc:0 "Temple bells echo through the courtyards while monks temper body and spirit alike. A senior monk evaluates your discipline before offering a word of guidance."
 cultivation_sect_visit.1102.t:0 "Eternal Harmony Pavilion"
 cultivation_sect_visit.1102.desc:0 "Silk screens and incense veil a school where paired practice is treated with solemn restraint. An elder asks whether your heart can truly maintain harmony."
 cultivation_sect_visit.1103.t:0 "Jade Lotus Temple"
 cultivation_sect_visit.1103.desc:0 "Lotus lanterns drift over still water as disciples speak softly of balance and inner clarity. A temple elder examines your temperament with serene detachment."
 cultivation_sect_visit.1104.t:0 "Sect of Supreme Equilibrium"
 cultivation_sect_visit.1104.desc:0 "Every disciple here strives for perfect equilibrium, neither indulging excess nor fleeing hardship. An elder studies whether your mind is steady enough to endure that path."
 cultivation_sect_visit.1150.t:0 "Mountain of Divine Beasts"
 cultivation_sect_visit.1150.desc:0 "The mountain resonates with roars, wingbeats, and oath-calls shared between cultivator and beast. A beastmaster elder watches how you react to the presence of sacred companions."
 cultivation_sect_visit.1151.t:0 "Celestial Phoenix Pavilion"
 cultivation_sect_visit.1151.desc:0 "Feathered spirit flames dance in the courtyards, and the air carries the majesty of noble birds. An elder of the pavilion weighs your affinity for auspicious flames."
 cultivation_sect_visit.1152.t:0 "Dragon-Tongue Pavilion"
 cultivation_sect_visit.1152.desc:0 "Dragon-blooded beasts coil through carved pillars and incense smoke, their presence old and proud. A pavilion elder listens for the cadence of your spirit before replying."
 cultivation_sect_visit.1153.t:0 "Temple of Spirit Communion"
 cultivation_sect_visit.1153.desc:0 "Disciples and spirit beasts move together here with uncanny understanding. A temple elder tests whether your heart can command respect without domination."
 cultivation_sect_visit.1154.t:0 "Thousand Beast Valley"
 cultivation_sect_visit.1154.desc:0 "Beast cries answer one another across the valley, where covenant marks are worn like badges of honor. An elder judges whether you can bear the burden of many bonds."
 cultivation_sect_visit.2000.t:0 "Crimson Moon Saber Hall"
 cultivation_sect_visit.2000.desc:0 "Moonlit saber forms cut crimson arcs across the training grounds, each stroke both elegant and lethal. A hall elder considers whether you possess the nerve for their art."
 cultivation_sect_visit.2001.t:0 "Tyrant Saber Palace"
 cultivation_sect_visit.2001.desc:0 "The palace breathes domineering intent, where hesitation is treated as weakness unworthy of the blade. An elder appraises your will as much as your skill."
 cultivation_sect_visit.2002.t:0 "Galehowl Saber Hall"
 cultivation_sect_visit.2002.desc:0 "Wind whistles through saber rings and hanging banners, masking sudden killing cuts. An elder gauges whether your instincts can keep pace with the gale."
 cultivation_sect_visit.2003.t:0 "Demon Suppressing Blade Clan"
 cultivation_sect_visit.2003.desc:0 "Scarred veterans sharpen heavy blades in silence, their duty fixed on the destruction of demonic foes. A clan elder studies your resolve with flinty eyes."
 cultivation_sect_visit.2004.t:0 "Black Iron Saber Hall"
 cultivation_sect_visit.2004.desc:0 "Black iron sabers rest like slabs of judgment beside disciples hardened by brute discipline. An elder weighs whether your body can endure their path."
 cultivation_sect_visit.2050.t:0 "Jade Cauldron Hall"
 cultivation_sect_visit.2050.desc:0 "The scent of rare herbs and heated jade cauldrons fills these halls. An alchemy elder watches for signs that your meridians can withstand deeper refinement."
 cultivation_sect_visit.2051.t:0 "Medicine King Valley"
 cultivation_sect_visit.2051.desc:0 "Physicians, pill masters, and wounded travelers alike pass through this valley in search of remedies and secrets. A valley elder tests your patience and discernment."
 cultivation_sect_visit.2052.t:0 "Hundred Herbs Pavilion"
 cultivation_sect_visit.2052.desc:0 "Terraces of spirit herbs sway beneath protective arrays, each leaf worth a fortune to the right hand. A pavilion elder measures your reverence for the medicinal dao."
 cultivation_sect_visit.2053.t:0 "Eternal Furnace Hall"
 cultivation_sect_visit.2053.desc:0 "Furnaces burn without rest, and every spark seems one mistake away from ruin or transcendence. An elder asks whether you can shoulder the risks of true refinement."
 cultivation_sect_visit.2054.t:0 "Hall of Transcendent Elixirs"
 cultivation_sect_visit.2054.desc:0 "Within this hall, pill smoke curls like auspicious clouds and impossible elixirs are spoken of in hushed tones. A senior alchemist evaluates whether you can approach such ambition."
 cultivation_sect_visit.2100.t:0 "Pure Yang Palace"
 cultivation_sect_visit.2100.desc:0 "Pure Yang disciples train beneath relentless heat, tempering body and spirit until both burn clean and bright. A palace elder searches your bearing for weakness or excess."
 cultivation_sect_visit.2101.t:0 "Yin Phoenix Sect"
 cultivation_sect_visit.2101.desc:0 "Graceful disciples circulate profound yin currents with the patience of winter water. An elder studies whether you can preserve elegance without losing resolve."
 cultivation_sect_visit.2102.t:0 "Pavilion of Blissful Concord"
 cultivation_sect_visit.2102.desc:0 "Here, paired cultivation is practiced as measured concord rather than indulgence, every exchange governed by breath and trust. An elder asks whether you understand restraint as well as desire."
 cultivation_sect_visit.2103.t:0 "Jade Chamber Court"
 cultivation_sect_visit.2103.desc:0 "Curtained chambers conceal manuals of inner circulation, subtle rites, and exacting body discipline. A court elder weighs your discretion before all else."
 cultivation_sect_visit.2104.t:0 "Hall of Lasting Harmony"
 cultivation_sect_visit.2104.desc:0 "The hall is hushed, its disciples pursuing lasting harmony through calm hearts and ordered qi. An elder observes whether your nature tends toward steadiness or turmoil."
 cultivation_sect_visit.2150.t:0 "Moonless Night Court"
 cultivation_sect_visit.2150.desc:0 "Light barely reaches these courtyards, where corpse lamps burn with a pallid, watchful glow. An elder of the court studies how calmly you face the arts of death."
 cultivation_sect_visit.2151.t:0 "Pale Bone Hall"
 cultivation_sect_visit.2151.desc:0 "Bells, talismans, and pale bones mark the grounds of this dreaded hall. A corpse-master elder evaluates whether your nerve will break in the presence of the undead."
 cultivation_sect_visit.2152.t:0 "Clan of Eternal Repose"
 cultivation_sect_visit.2152.desc:0 "Funerary chants drift through the compound as bound dead labor in grim silence. An elder asks whether you can bear the karmic burden of disturbing the grave."
 cultivation_sect_visit.2153.t:0 "Temple of Withered Souls"
 cultivation_sect_visit.2153.desc:0 "Withered banners hang above halls steeped in death qi and battlefield relics. A temple elder measures whether your spirit can endure such desolation."
 cultivation_sect_visit.2154.t:0 "Jiangshi March Sect"
 cultivation_sect_visit.2154.desc:0 "Jiangshi stand in ordered ranks like soldiers awaiting command, their talismans fluttering in the stale air. An elder watches to see if fear masters you before discipline can."
 cultivation_sect_visit.3000.t:0 "Scarlet River Hall"
 cultivation_sect_visit.3000.desc:0 "The scent of blood and iron lingers heavily here, and every disciple carries old slaughter in their eyes. An elder considers whether your resolve is sharp enough for their path."
 cultivation_sect_visit.3001.t:0 "Valley of Ten Thousand Corpses"
 cultivation_sect_visit.3001.desc:0 "Bones carpet the valley floor, while resentful qi rises from every burial mound and killing field. A valley elder asks whether you can walk among the dead without faltering."
 cultivation_sect_visit.3002.t:0 "Asura War Hall"
 cultivation_sect_visit.3002.desc:0 "War drums and shouted challenges shake these halls, where combat is both doctrine and devotion. An elder judges whether battle has already carved itself into your bones."
 cultivation_sect_visit.3050.t:0 "Hall of Five Venoms"
 cultivation_sect_visit.3050.desc:0 "Venom jars, preserved carcasses, and toxin manuals line the halls in careful order. An elder examines whether you fear poison more than you respect it."
 cultivation_sect_visit.3051.t:0 "Valley of Venomous Serpents"
 cultivation_sect_visit.3051.desc:0 "Spirit serpents coil through the valley shadows, their venom milked like liquid jade. An elder watches whether you recoil or remain steady before their fangs."
 cultivation_sect_visit.3052.t:0 "Sect of the Miasma Marsh"
 cultivation_sect_visit.3052.desc:0 "The marsh fumes alone would fell ordinary men, yet its disciples breathe them as though they were mountain air. An elder studies whether your body can endure corruption without collapse."
 cultivation_sect_visit.3100.t:0 "Crimson Yin Sect"
 cultivation_sect_visit.3100.desc:0 "Blood lamps burn low while disciples refine yin and essence through dangerous, beautiful rites. An elder studies your appetite for power and the ruin it invites."
 cultivation_sect_visit.3101.t:0 "Blood Moon Demon Hall"
 cultivation_sect_visit.3101.desc:0 "Crimson moon banners stir above altars darkened by old sacrifice. A demonic elder weighs whether you can bear the hall's omens and hunger."
 cultivation_sect_visit.3102.t:0 "Scarlet Heart Palace"
 cultivation_sect_visit.3102.desc:0 "The palace preserves forbidden heart methods whispered of in dread across the jianghu. An elder asks whether you seek power strongly enough to stain your conscience."
 cultivation_sect_visit.3150.t:0 "Palace of Devouring Shadows"
 cultivation_sect_visit.3150.desc:0 "Curtains of shadow and illusion conceal halls where beguiling arts become weapons of cultivation. An elder studies your vitality and whether your will can master temptation instead of serving it."
 cultivation_sect_visit.3151.t:0 "Crimson Seal Sect"
 cultivation_sect_visit.3151.desc:0 "Blood-seal diagrams cover the chamber walls in secret, meticulous strokes. An elder tests whether you can wield binding arts without being consumed by them."
 cultivation_sect_visit.4000.t:0 "Lone Wolf Lodge"
 cultivation_sect_visit.4000.desc:0 "These wanderers keep little besides their blades, their honor, and the road ahead. A lodge elder regards you with the caution of one who trusts deeds over vows."
 cultivation_sect_visit.4001.t:0 "Rootless Sword Society"
 cultivation_sect_visit.4001.desc:0 "Rootless swordsmen gather beneath patched banners, each a master of surviving without patron or clan. An elder judges whether you can carry freedom without drifting into chaos."
 cultivation_sect_visit.4002.t:0 "Brotherhood of Wandering Blades"
 cultivation_sect_visit.4002.desc:0 "Road-worn warriors trade oaths beneath weathered banners, their brotherhood forged in ambushes, inns, and moonlit duels. A senior brother steps forward to judge your worth."
 cultivation_sect_visit.4050.t:0 "Thousand Treasures Pavilion"
 cultivation_sect_visit.4050.desc:0 "Treasure lists, sealed cases, and fragments of forgotten inheritances crowd every chamber. A pavilion elder wonders whether you seek relics for greed, glory, or understanding."
 cultivation_sect_visit.4051.t:0 "Hall of Mystic Forging"
 cultivation_sect_visit.4051.desc:0 "Hammer blows echo from hidden forges where spirit metals are folded with patient reverence. An elder appraises whether your hands and will are fit for the smith's arduous dao."
 cultivation_sect_visit.4052.t:0 "Hall of Ancient Relics"
 cultivation_sect_visit.4052.desc:0 "Dusty maps, broken seals, and half-awakened relics suggest countless ruins already opened. An elder looks for the hunger that drives one to brave old tombs and hidden realms."
 cultivation_sect_visit.4100.t:0 "Temple of Ancestral Bloodlines"
 cultivation_sect_visit.4100.desc:0 "Ancestral tablets and blood awakening rites fill this temple with old majesty and old burdens. An elder examines whether your lineage can withstand what it seeks to uncover."
 cultivation_sect_visit.4101.t:0 "Sect of the Primal Beast"
 cultivation_sect_visit.4101.desc:0 "Bestial roars answer body-forging chants as disciples court transformation through pain and instinct. An elder measures whether you can rule the beast within rather than be devoured by it."
 cultivation_sect_visit.4102.t:0 "Primordial Chaos Hall"
 cultivation_sect_visit.4102.desc:0 "The hall teaches return to primordial chaos through brutal body tempering and impossible endurance. An elder waits to see whether your flesh carries even a spark of that ancient violence."
 cultivation_sect_visit.4150.t:0 "Mountain of Untamed Beasts"
 cultivation_sect_visit.4150.desc:0 "Scars, trophies, and beast howls define a mountain where tamers win loyalty through daring and bloodshed. An elder watches whether you stand firm before untamed ferocity."
 cultivation_sect_visit.4151.t:0 "Savage Fang Lodge"
 cultivation_sect_visit.4151.desc:0 "Handlers and companions alike bear fang marks and old wounds, proof that domination alone earns nothing here. An elder considers whether you can survive the clan's savage tests."
 cultivation_sect_visit.4152.t:0 "Spirit Bond Sect"
 cultivation_sect_visit.4152.desc:0 "Covenant circles and spirit-rope talismans mark a sect where beast and human ascend together. An elder studies whether your spirit can truly share strength with another life."

 ## JOIN EVENTS

 cultivation_sect_join.1000.t:0 "Join the Mount Hua Sect"
 cultivation_sect_join.1000.desc:0 "The elder of Mount Hua tests whether your heart is steady enough for a righteous sword path and whether your purse can support admission."
 cultivation_sect_join.1001.t:0 "Join the Heavenly Sword Pavilion"
 cultivation_sect_join.1001.desc:0 "A pavilion elder examines your sword bearing, cultivation, and means before deciding whether the Heavenly Sword Pavilion will accept you."
 cultivation_sect_join.1002.t:0 "Join the Azure Edge Sect"
 cultivation_sect_join.1002.desc:0 "The sect elder measures the sharpness of your movements, the steadiness of your breath, and the wealth you can offer Azure Edge."
 cultivation_sect_join.1003.t:0 "Join the Ten Thousand Swords Valley"
 cultivation_sect_join.1003.desc:0 "The valley elder weighs your foundation, resources, and affinity for a life steeped in sword intent before answering your request."
 cultivation_sect_join.1004.t:0 "Join the Violet Thunder Blade Sect"
