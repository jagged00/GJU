 ## CULTIVATION PATH TENETS
 #######################

 # Orthodox Cultivation
 tenet_orthodox_cultivation:0 "Orthodox Cultivation"
 tenet_orthodox_cultivation_desc:0 "This sect follows the orthodox cultivation path, emphasizing moral conduct, honor, and proper techniques passed down through generations. Its cultivators are respected among their peers."
 tenet_orthodox_cultivation_name:0 "Orthodox Path"

 # Unorthodox Cultivation
 tenet_unorthodox_cultivation:0 "Unorthodox Cultivation"
 tenet_unorthodox_cultivation_desc:0 "This sect practices unorthodox cultivation methods, pursuing alternative paths that deviate from traditional teachings. While not evil, their techniques are unconventional and grant faster cultivation progress."
 tenet_unorthodox_cultivation_name:0 "Unorthodox Path"

 # Demonic Cultivation
 tenet_demonic_cultivation:0 "Demonic Cultivation"
 tenet_demonic_cultivation_desc:0 "This sect embraces demonic cultivation, using forbidden techniques that harvest others' essence for power. Demonic cultivators inspire fear and gain cultivation speed at the cost of their humanity."
 tenet_demonic_cultivation_name:0 "Demonic Path"

 # Vagrant Cultivation
 tenet_vagrant_cultivation:0 "Vagrant Cultivation"
 tenet_vagrant_cultivation_desc:0 "This sect consists of wandering cultivators without fixed traditions, adapting techniques from various sources. Vagrant cultivators are free-spirited and resilient, finding their own path to immortality."
 tenet_vagrant_cultivation_name:0 "Vagrant Path"

